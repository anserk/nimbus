on:
  push:
    branches:
      - main
      - develop
    paths:
      - "weather/src/**"
      - "weather/Dockerfile"
      - ".github/workflows/build-push.yml"

env:
  rg-name: rg-learning
  registry: mylearningacr
  image-name: etl/weather

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push to ACR
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          az acr build \
            --registry ${{ env.registry }} \
            --image ${{ env.image-name }}:${{ github.sha }} \
            --image ${{ env.image-name }}:$BRANCH \
            --file ./weather/Dockerfile \
            ./weather

      - name: Update job image
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          az containerapp job update \
            --name weather-etl-job \
            --resource-group ${{ env.rg-name }} \
            --image ${{ env.registry }}.azurecr.io/${{ env.image-name }}:$BRANCH

      # - name: Generate artifact attestation
      #   uses: actions/attest@v4
