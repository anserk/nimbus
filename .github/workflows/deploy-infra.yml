on:
  push:
    paths:
      - "infra/**"

env:
  rg-name: rg-learning
  location: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: create resource group
        run: az group create --name ${{ env.rg-name }} --location ${{ env.location }}

      - name: deploy infra
        id: infra
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/main.bicep \
            --parameters githubServicePrincipalId=${{ secrets.AZURE_CLIENT_ID }}
            --query properties.outputs -o json)
          echo "storageAccountName=$(echo $RESULT | jq -r '.storageAccountName.value')" >> $GITHUB_OUTPUT
          echo "kvName=$(echo $RESULT | jq -r '.kvName.value')" >> $GITHUB_OUTPUT

      - name: store connection string in KV
        run: |
          CONN_STR=$(az storage account show-connection-string \
            --name ${{ steps.infra.outputs.storageAccountName }} \
            --resource-group ${{ env.rg-name }} \
            --query connectionString -o tsv)
          az keyvault secret set \
            --vault-name ${{ steps.infra.outputs.kvName }} \
            --name queue-connection-string \
            --value "$CONN_STR"
