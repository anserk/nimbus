on:
  workflow_dispatch:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"

env:
  rg-name: rg-learning
  location: eastus2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: deploy core infra
        id: infra
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/main.bicep \
            --query properties.outputs -o json)
          echo "storageAccountName=$(echo $RESULT | jq -r '.storageAccountName.value')" >> $GITHUB_OUTPUT
          echo "storageAccountId=$(echo $RESULT | jq -r '.storageAccountId.value')" >> $GITHUB_OUTPUT
          echo "acrLoginServer=$(echo $RESULT | jq -r '.acrLoginServer.value')" >> $GITHUB_OUTPUT
          echo "acrId=$(echo $RESULT | jq -r '.acrId.value')" >> $GITHUB_OUTPUT
          echo "weatherOutputContainerName=$(echo $RESULT | jq -r '.weatherOutputContainerName.value')" >> $GITHUB_OUTPUT
          echo "weatherQueueName=$(echo $RESULT | jq -r '.weatherQueueName.value')" >> $GITHUB_OUTPUT
          echo "workspaceName=$(echo $RESULT | jq -r '.workspaceName.value')" >> $GITHUB_OUTPUT
          echo "trafficOutputContainerName=$(echo $RESULT | jq -r '.trafficOutputContainerName.value')" >> $GITHUB_OUTPUT
          echo "trafficQueueName=$(echo $RESULT | jq -r '.trafficQueueName.value')" >> $GITHUB_OUTPUT


      - name: get current job image or default
        id: img
        run: |
          CURRENT_IMAGE=$(az containerapp job show \
            --name weather-etl-job \
            --resource-group ${{ env.rg-name }} \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null \
            || echo "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest")
          echo "currentImage=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

      - name: deploy aca job
        run: |
          az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/aca-job.bicep \
            --parameters acrLoginServer=${{ steps.infra.outputs.acrLoginServer }} \
            --parameters acrId=${{ steps.infra.outputs.acrId }} \
            --parameters outputContainer=${{ steps.infra.outputs.weatherOutputContainerName }} \
            --parameters storageAccountId=${{ steps.infra.outputs.storageAccountId }} \
            --parameters storageAccountName=${{ steps.infra.outputs.storageAccountName }} \
            --parameters image=${{ steps.img.outputs.currentImage }} \
            --parameters weatherQueueName=${{ steps.infra.outputs.weatherQueueName }} \
            --parameters workspaceName=${{ steps.infra.outputs.workspaceName }}
