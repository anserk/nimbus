on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"

env:
  rg-name: rg-learning
  location: eastus2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: deploy core infra
        id: infra
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/main.bicep \
            --parameters deploymentPrincipalObjectId=${{ secrets.AZURE_OBJECT_ID }} \
            --query properties.outputs -o json)
          echo "storageAccountName=$(echo $RESULT | jq -r '.storageAccountName.value')" >> $GITHUB_OUTPUT
          echo "kvName=$(echo $RESULT | jq -r '.kvName.value')" >> $GITHUB_OUTPUT
          echo "acrLoginServer=$(echo $RESULT | jq -r '.acrLoginServer.value')" >> $GITHUB_OUTPUT
          echo "acrId=$(echo $RESULT | jq -r '.acrId.value')" >> $GITHUB_OUTPUT
          echo "outputContainer=$(echo $RESULT | jq -r '.outputContainerName.value')" >> $GITHUB_OUTPUT

      - name: store connection string in KV
        run: |
          CONN_STR=$(az storage account show-connection-string \
            --name ${{ steps.infra.outputs.storageAccountName }} \
            --resource-group ${{ env.rg-name }} \
            --query connectionString -o tsv)
          az keyvault secret set \
            --vault-name ${{ steps.infra.outputs.kvName }} \
            --name storage-connection-string \
            --value "$CONN_STR"

      - name: deploy aca job
        run: |
          az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/aca-job.bicep \
            --parameters acrLoginServer=${{ steps.infra.outputs.acrLoginServer }} \
            --parameters acrId=${{ steps.infra.outputs.acrId }} \
            --parameters kvName=${{ steps.infra.outputs.kvName }} \
            --parameters outputContainer=${{ steps.infra.outputs.outputContainer }} \
            --parameters cities="${{ vars.CITIES }}"
