on:
  push:
    paths:
      - "infra/**"

env:
  rg-name: rg-learning
  location: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: create resource group
        run: az group create --name ${{ env.rg-name }} --location ${{ env.location }}

      - name: create storage and queue
        id: storage
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/queue.bicep \
            --query properties.outputs -o json)
          echo "storageAccountName=$(echo $RESULT | jq -r '.storageAccountName.value')" >> $GITHUB_OUTPUT
          echo "queueName=$(echo $RESULT | jq -r '.queueName.value')" >> $GITHUB_OUTPUT

      - name: create kv
        id: kv
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/kv.bicep \
            --query properties.outputs -o json)
          echo "name=$(echo $RESULT | jq -r '.name.value')" >> $GITHUB_OUTPUT

      - name: store connection string in KV
        run: |
          CONN_STR=$(az storage account show-connection-string \
            --name ${{ steps.storage.outputs.storageAccountName }} \
            --resource-group ${{ env.rg-name }} \
            --query connectionString -o tsv)
          az keyvault secret set \
            --vault-name ${{steps.kv.outputs.name}} \
            --name queue-connection-string \
            --value "$CONN_STR"

      - name: deploy acr
        id: acr
        run: |
          RESULT=$(az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/acr.bicep \
            --query properties.outputs -o json)
          echo "acrId=$(echo $RESULT | jq -r '.acrId.value')" >> $GITHUB_OUTPUT
          echo "acrLoginServer=$(echo $RESULT | jq -r '.acrLoginServer.value')" >> $GITHUB_OUTPUT

      - name: deploy aca
        run: |
          az deployment group create \
            --resource-group ${{ env.rg-name }} \
            --template-file infra/aca.bicep \
            --parameters acrId=${{ steps.acr.outputs.acrId }} \
            --parameters queueName=${{ steps.storage.outputs.queueName }} \
            --parameters kvName=${{ steps.kv.outputs.name }}
