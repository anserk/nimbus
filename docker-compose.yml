services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: weather-azurite
    command: azurite --skipApiVersionCheck
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
      - "10002:10002" # table

  weather-app:
    build: ./weather
    container_name: weather-app
    env_file: ./weather/.env
    depends_on:
      - azurite
